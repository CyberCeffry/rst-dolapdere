name: dere_sozlesme_takip
description: "Reklam alanı ve sözleşme takip uygulaması."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firestore veritabanı
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0

  # Cihazda küçük verileri ve ayarları saklama
  shared_preferences: ^2.5.6

  # Yerel bildirimler
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

  # Tarih, saat ve para biçimlendirme
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # Arayüz ikonları
  cupertino_icons: ^1.0.8
  pdf: ^3.12.0
  printing: ^5.14.3
  firebase_auth: ^7.0.1
  cloud_functions: ^7.0.1
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Variable.ttf
